name: Update Panchbibi News Feed

on:
  schedule:
    # Run every 6 hours
    - cron: '0 */6 * * *'
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: news-feed-update
  cancel-in-progress: false

jobs:
  update-feed:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Run Tests
        run: npm test

      - name: Type Check
        run: npm run check

      - name: Fetch and Update News
        run: npm run fetch

      - name: Commit and Push if Changed
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"

          if [ -n "$(git status --porcelain public/)" ]; then
            echo "News feed content updated. Committing changes..."
            git add public/
            git diff --staged --quiet || git commit -m "chore: update Panchbibi news feed"
            git push origin HEAD:main
          else
            echo "No news feed changes detected. Skipping commit."
          fi

      - name: Verify Artifacts for Pages
        run: |
          for file in public/index.html public/news.json public/news.js; do
            if [ ! -f "$file" ]; then
              echo "Error: Required artifact $file does not exist!"
              exit 1
            fi
          done
          node -e "JSON.parse(require('fs').readFileSync('public/news.json', 'utf8'))" || { echo "Error: public/news.json is not valid JSON"; exit 1; }
          grep -q "window.PANCHBIBI_NEWS_FEED" public/news.js || { echo "Error: public/news.js does not contain window.PANCHBIBI_NEWS_FEED"; exit 1; }
          echo "All required artifacts verified successfully."

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages Artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: './public'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
